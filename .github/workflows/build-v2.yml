# Strata 0.2 line (branch main): image tags v0.2.<n>. The Strata 0.1 line has its own workflow, build-v1.yml, on the branch strata-v1.
name: Build and Push Strata Image (Strata 0.2)

on:
  workflow_dispatch:
    inputs:
      strata_image:
        description: "Strata's image to build on, e.g. ghcr.io/niko1221/strata:0.2.9-cuda13. Empty: the repository variable STRATA_IMAGE, else 0.2.9-cuda13"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  DOCKER_PLATFORM: linux/amd64
  STRATA_IMAGE: ${{ inputs.strata_image || vars.STRATA_IMAGE || 'ghcr.io/niko1221/strata:0.2.9-cuda13' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rsync jq fio gcc

      - name: Syntax check of all scripts
        run: for f in *.sh scripts/*.sh tests/*.sh; do bash -n "$f" || exit 1; done

      - name: Test the nvidia-smi shim
        run: python3 tests/test_shim.py
      - name: Queue handler tests
        run: pip install requests && python3 tests/test_handler.py
      - name: Hardware bench tests (ssd, ram, pcie against a fake driver)
        run: python3 tests/test_bench_hw.py
      - name: Smoke test script (against a fake image root)
        run: python3 tests/test_smoke.py
      - name: Bench client tests
        run: python3 tests/test_bench_parallel.py

      # start.sh with a fake Strata image entrypoint: environment mapping, local data copy, store sync (no GPU, no download)
      - name: Test start.sh
        run: sudo bash tests/run.sh

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Set image name (GHCR needs lowercase) and version
        run: |
          echo "DOCKER_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/strata-runpod" >> "$GITHUB_ENV"
          # this workflow counts runs from 1; v0.2.27 was the last image built by the old shared workflow (dev.yml), so the numbers go on from there
          echo "IMAGE_VERSION=0.2.$((GITHUB_RUN_NUMBER + 27))" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin the base image (digest)
        run: |
          d=$(docker buildx imagetools inspect "$STRATA_IMAGE" --format '{{json .Manifest}}' | jq -r .digest) || d=unknown
          echo "STRATA_BASE_DIGEST=${d:-unknown}" >> "$GITHUB_ENV"
          echo "Base image: $STRATA_IMAGE @ ${d:-unknown}"

      - name: Build the image (for the smoke test, not pushed)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.DOCKER_PLATFORM }}
          load: true
          push: false
          provenance: false
          build-args: |
            STRATA_IMAGE=${{ env.STRATA_IMAGE }}
            IMAGE_VERSION=v${{ env.IMAGE_VERSION }}
            IMAGE_COMMIT=${{ github.sha }}
            STRATA_BASE_DIGEST=${{ env.STRATA_BASE_DIGEST }}
          tags: strata-runpod:smoke
          cache-from: type=gha

      - name: Smoke test of the built image (Strata's entry points, our files)
        run: |
          docker run --rm --entrypoint bash -v "$PWD/tests/smoke-image.sh:/smoke.sh:ro" strata-runpod:smoke /smoke.sh
          # our entry point is still the one in the Dockerfile, and the build info is in the labels
          test "$(docker inspect --format '{{json .Config.Entrypoint}}' strata-runpod:smoke)" = '["/usr/bin/tini","--","/opt/runpod/entry.sh"]'
          docker inspect --format '{{json .Config.Labels}}' strata-runpod:smoke | jq -r 'to_entries[] | select(.key | startswith("io.runpod-strata") or startswith("com.strata")) | "  \(.key) = \(.value)"'

      - name: Push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.DOCKER_PLATFORM }}
          push: true
          build-args: |
            STRATA_IMAGE=${{ env.STRATA_IMAGE }}
            IMAGE_VERSION=v${{ env.IMAGE_VERSION }}
            IMAGE_COMMIT=${{ github.sha }}
            STRATA_BASE_DIGEST=${{ env.STRATA_BASE_DIGEST }}
          tags: |
            ${{ env.DOCKER_IMAGE }}:v${{ env.IMAGE_VERSION }}
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
