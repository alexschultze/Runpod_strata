name: Build and Push Strata Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOCKER_PLATFORM: linux/amd64

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rsync zstd jq

      - name: Syntax check of all scripts
        run: for f in *.sh scripts/*.sh tests/*.sh; do bash -n "$f" || exit 1; done

      - name: Test the nvidia-smi shim
        run: python3 tests/test_shim.py
      - name: Queue handler tests
        run: pip install requests && python3 tests/test_handler.py

      # start.sh with a fake Strata repo: key, archive, restore, data copy, version change, hook, API key (no GPU, no download)
      - name: Test start.sh
        run: sudo bash tests/run.sh

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Set image name (GHCR needs lowercase)
        run: echo "DOCKER_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/strata-runpod" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.DOCKER_PLATFORM }}
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:v0.1.${{ github.run_number }}
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
